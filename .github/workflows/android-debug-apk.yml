name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal_mayhem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: animal_mayhem/android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Android platform 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          if [ -z "$SDK" ]; then
            echo "Android SDK path is not set on the runner"
            exit 1
          fi
          SDKMANAGER=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; Flutter Gradle may still download SDK packages"
            exit 0
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "platform-tools" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK location: animal_mayhem/$APK"

      - name: Stage APK artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/apk-artifact"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "${GITHUB_WORKSPACE}/apk-artifact/app-debug.apk"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== Flutter ==="
            flutter --version
            echo
            echo "=== Dart ==="
            dart --version
            echo
            echo "=== Tests ==="
            echo "flutter test completed successfully in this workflow"
          } > "${GITHUB_WORKSPACE}/apk-artifact/build-info.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animal-mayhem-debug-apk
          path: apk-artifact/
          if-no-files-found: error
